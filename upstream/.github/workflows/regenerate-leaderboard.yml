# Regenerate the TypeEvalPy leaderboard against the current ground truth.
#
# Drops into `.github/workflows/regenerate-leaderboard.yml` of TypeEvalPy.
# Reuses the repo's existing `src/main_runner.py` runner + `result_analyzer`
# scorer + `docs/leaderboard/analysis_leaderboard.py` generator — no
# duplicated machinery.
#
# Why this exists: today the leaderboard markdown is regenerated by a manual
# script with a hardcoded `EXPERIMENT_RUN_ON = "14 Jan 2024"` constant
# (`docs/leaderboard/analysis_leaderboard.py:6`). Each time the ground truth
# changes (e.g. April-2026 inheritance/MRO fix in commit 3719de11), the
# published board drifts away from the actual scorer. This workflow keeps
# them in sync.
#
# Default scope: deterministic baselines only (HeaderGen, Pyright, Scalpel,
# Jedi, HiTyper). The expensive LLM runs are gated behind an explicit
# `include_llms` input so the workflow stays cheap to re-run on every GT
# change.

name: Regenerate leaderboard

on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Space-separated runner names (default: deterministic baselines)'
        required: false
        default: 'headergen pyright scalpel jedi hityper'
        type: string
      include_llms:
        description: 'Also run the LLM tools (Ollama / API)'
        required: false
        default: false
        type: boolean
      benchmark_dir:
        description: 'Benchmark to score (default: micro-benchmark)'
        required: false
        default: 'micro-benchmark'
        type: string
  push:
    branches: [main]
    paths:
      - 'micro-benchmark/**'
      - 'src/result_analyzer/**'

permissions:
  contents: write       # to commit the regenerated leaderboard markdown
  pull-requests: write  # to open the PR

jobs:
  regenerate:
    name: Regenerate against current GT
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout TypeEvalPy
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install harness dependencies
        run: pip install -r requirements.txt

      - name: Record run metadata
        id: meta
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "run_date=$(date -u '+%d %b %Y')" >> "$GITHUB_OUTPUT"
          echo "iso_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Resolve tool list
        id: tools
        run: |
          set -e
          TOOLS="${{ github.event.inputs.tools || 'headergen pyright scalpel jedi hityper' }}"
          if [ "${{ github.event.inputs.include_llms }}" = "true" ]; then
            TOOLS="$TOOLS ollama llms"
          fi
          echo "list=$TOOLS" >> "$GITHUB_OUTPUT"
          echo "Selected runners: $TOOLS"

      - name: Run runners
        working-directory: src
        run: |
          set -e
          python main_runner.py --runners ${{ steps.tools.outputs.list }}

      - name: Stamp leaderboard date with actual run date
        run: |
          # Replace the hardcoded EXPERIMENT_RUN_ON literal in
          # docs/leaderboard/analysis_leaderboard.py with the actual UTC
          # run date so the markdown footer reflects when the board was
          # regenerated, not the (long-stale) hardcoded constant.
          script=docs/leaderboard/analysis_leaderboard.py
          test -f "$script"
          sed -i.bak \
            "s|^EXPERIMENT_RUN_ON = \".*\"|EXPERIMENT_RUN_ON = \"${{ steps.meta.outputs.run_date }}\"|" \
            "$script"
          diff -u "$script.bak" "$script" || true
          rm -f "$script.bak"

      - name: Regenerate leaderboard markdown
        working-directory: docs/leaderboard
        run: python analysis_leaderboard.py

      - name: Upload raw results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: typeevalpy-results-${{ steps.meta.outputs.short_commit }}
          path: results/
          if-no-files-found: warn

      - name: Open PR if leaderboard changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            docs: regenerate leaderboard against GT @ ${{ steps.meta.outputs.short_commit }}

            Tools: ${{ steps.tools.outputs.list }}
            Run date: ${{ steps.meta.outputs.iso_date }}
            Benchmark commit: ${{ steps.meta.outputs.commit }}
          branch: bot/leaderboard-${{ steps.meta.outputs.short_commit }}
          title: 'Regenerate leaderboard against GT @ ${{ steps.meta.outputs.short_commit }}'
          body: |
            Automated regeneration of the TypeEvalPy leaderboard against the current
            ground truth at commit `${{ steps.meta.outputs.commit }}`.

            **Tools run:** `${{ steps.tools.outputs.list }}`
            **Run date (UTC):** ${{ steps.meta.outputs.iso_date }}
            **Benchmark commit:** `${{ steps.meta.outputs.commit }}`

            Raw `_result.json` files are attached as an artifact on this workflow run.
            Verify the diff before merging — large unexpected swings in any tool's
            numbers usually indicate a runner regression rather than a GT shift.
          labels: leaderboard,automated
          add-paths: |
            docs/**
            README.md
